services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: senpilot-test
      POSTGRES_DB: senpilot_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d senpilot_test"]
      interval: 2s
      timeout: 2s
      retries: 20
